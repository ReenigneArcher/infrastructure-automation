---
name: Keepalive

on:
  schedule:
    # Run on the first day of each month at 12:17 UTC.
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keepalive-workflow
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked --no-dev --no-build --no-install-project --no-python-downloads

      - name: Keep scheduled workflows active
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev --no-build --no-sync python .github/scripts/keepalive.py
