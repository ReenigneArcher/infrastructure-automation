---
name: Keepalive

on:
  schedule:
    # Run on the first day of each month at 12:17 UTC.
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive-workflow
  cancel-in-progress: false

jobs:
  update_timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update and commit timestamp
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update keepalive timestamp'
          git push origin "HEAD:${DEFAULT_BRANCH}"
